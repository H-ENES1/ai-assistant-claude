<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<title>Token Tahmini · video sahneleri</title>
<!--
  Tanıtım videolarının hepsi bu dosyadan çıkar. Kare kare çizilir: window.render(t) saniyeyi alır, sayfayı o ana getirir.
  Durum tutulmaz; aynı t her zaman aynı kareyi verir. Kaydedici: rec4.cjs. Sayılar: data.js (data.mjs üretir, eklentinin kendi motoru).
    anim4.html?v=main|tiko|water|model|linkedin|demo&lang=tr|en&w=1920&h=1080
  Sohbet arayüzü claude.ai'nin kopyası DEĞİLDİR: genel bir sohbet penceresi, üstünde "claude.ai'de · temsili arayüz" yazar.
  Anthropic logosu, yazı tipi ya da marka ögesi yok. Tiko, sitedeki piksel botun aynısıdır (aynı ızgara, aynı renkler).
  Yazı tipleri sistemden gelir (Segoe UI, Cascadia/Consolas); başka makinede görünüm biraz değişebilir.
-->
<style>
:root { --bg: #0e111b; --ink: #f4f2ec; --mut: #a8afc0; --acc: #f28c28; --acc2: #ffb35c; --ok: #2f9d6a; --bad: #d8503f; --amb: #d9982b; --wat: #3f8fd6;
  --p-bg: #f4f5f8; --p-ink: #1b1f2a; --p-mut: #5b6272; --p-line: #dfe2e9;
  --sans: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace; }
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bg); overflow: hidden; }
#root { position: absolute; left: 0; top: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); }
#glowA, #glowB { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; }
#glowA { background: #b85a1a; } #glowB { background: #1d3f7a; }
#grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.5px, transparent 1.6px); background-size: 36px 36px; }
#prog { position: absolute; left: 0; top: 0; height: 6px; background: var(--acc); }
#brand { position: absolute; display: flex; align-items: center; gap: 16px; font: 600 28px var(--mono); color: var(--ink); letter-spacing: .01em; }
#brand .tk { position: relative; flex: none; }
.sc { position: absolute; inset: 0; }
.abs { position: absolute; }

/* Tiko */
.tk { position: absolute; left: 0; top: 0; width: calc(14px * var(--tp)); height: calc(17px * var(--tp)); --tp: 7; z-index: 5; }
.tk svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; overflow: visible; }
.tk .sp { position: absolute; inset: 0; transform-origin: 50% 100%; }
.tk .sh { position: absolute; left: 14%; right: 14%; bottom: calc(-0.5px * var(--tp)); height: calc(1px * var(--tp)); border-radius: 50%; background: rgba(0,0,0,.28); }
.tk .mail { position: absolute; right: calc(-5px * var(--tp)); top: calc(1px * var(--tp)); width: calc(7px * var(--tp)); height: calc(5px * var(--tp)); }

/* Altyazı bloğu */
.cap { position: absolute; }
.ci { position: absolute; left: 0; right: 0; top: 0; }
.wide .ci { top: 50%; }
.ci .k { font: 600 var(--fk) var(--mono); letter-spacing: .1em; color: var(--acc2); text-transform: uppercase; }
.ci .h { font-weight: 700; font-size: var(--fh); line-height: 1.06; letter-spacing: -0.025em; margin-top: .22em; text-wrap: balance; }
.ci .p { font-size: var(--fp); line-height: 1.36; color: #d5d9e4; margin-top: .7em; text-wrap: pretty; }

/* Panel (sohbet penceresi ve kartlar) */
.dev { position: absolute; background: var(--p-bg); color: var(--p-ink); border-radius: 30px; display: flex; flex-direction: column;
  box-shadow: 0 50px 130px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.1); }
.d-bar { flex: none; height: 68px; display: flex; align-items: center; gap: 10px; padding: 0 26px; border-bottom: 1.5px solid var(--p-line); font: 600 25px var(--mono); color: var(--p-mut); }
.d-bar i { width: 14px; height: 14px; border-radius: 50%; background: #cdd2dc; }
.d-on { margin-left: 12px; color: var(--p-ink); }
.d-rep { margin-left: auto; font-weight: 500; padding: 4px 12px; border-radius: 999px; background: #e7eaf0; }
.d-msgs { flex: 1; min-height: 0; position: relative; padding: 26px 30px; display: flex; flex-direction: column; gap: 22px; }
.d-user { align-self: flex-end; max-width: 80%; background: #dce3f0; border-radius: 26px 26px 6px 26px; padding: 18px 24px; font-size: 33px; line-height: 1.34; }
.d-ans { background: #fff; border: 1.5px solid var(--p-line); border-radius: 22px; padding: 26px 26px; display: grid; gap: 18px; }
.d-ans i { height: 20px; border-radius: 10px; background: #d5d9e3; transform-origin: 0 50%; display: block; }
.d-ext { position: absolute; left: 30px; right: 30px; bottom: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.x-adv { align-self: stretch; display: flex; gap: 16px; align-items: flex-start; padding: 18px 22px; border-radius: 20px; background: #eef7f2; border: 2px solid #94c2ab; box-shadow: 0 18px 40px -20px rgba(20,30,40,.45); }
.x-adv.up { background: #fff5e6; border-color: #e0ad6a; }
.x-ic { flex: none; width: 50px; height: 50px; border-radius: 50%; background: var(--ok); color: #fff; font: 700 30px/50px var(--sans); text-align: center; }
.x-adv.up .x-ic { background: #b8741a; }
.x-t { display: block; font-size: 33px; font-weight: 700; line-height: 1.24; letter-spacing: -0.01em; }
.x-d { display: block; margin-top: 6px; font-size: 28px; color: #47505f; line-height: 1.3; }
.x-pill { display: flex; align-items: center; gap: 12px; padding: 10px 24px 10px 18px; border-radius: 999px; background: #fff; border: 1.5px solid #d0d5de; font-size: 31px; white-space: nowrap; box-shadow: 0 10px 26px -12px rgba(20,30,40,.45); transform-origin: 100% 100%; }
.x-pill .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--ok); }
.x-pill b { font-weight: 700; font-variant-numeric: tabular-nums; display: inline-block; }
.x-pill span { color: var(--p-mut); }
.d-comp { flex: none; margin: 0 30px 28px; background: #fff; border: 1.5px solid #cbd0da; border-radius: 26px; padding: 20px 24px 16px; display: flex; flex-direction: column; }
.d-text { font-size: 33px; line-height: 1.34; min-height: 90px; }
.caret { display: inline-block; width: 3px; height: 38px; background: var(--p-ink); vertical-align: -7px; margin-left: 1px; }
.ph { color: #9aa1ae; }
.d-row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.chip { font: 500 25px var(--mono); padding: 8px 17px; border-radius: 999px; background: #eceef3; position: relative; }
.send { margin-left: auto; width: 60px; height: 60px; border-radius: 50%; background: #2b3340; color: #fff; font: 700 31px/60px var(--sans); text-align: center; }

/* Kart başlığı */
.c-head { flex: none; display: flex; align-items: center; gap: 14px; padding: 28px 34px 0; font-weight: 700; font-size: 35px; letter-spacing: -0.015em; }
.tag { font: 500 23px var(--mono); padding: 4px 12px; border-radius: 999px; background: #e7eaf0; color: var(--p-mut); letter-spacing: 0; white-space: nowrap; }
.c-body { flex: 1; min-height: 0; padding: 22px 34px 30px; display: flex; flex-direction: column; }

/* Su ve enerji */
.w-msgs { display: grid; grid-template-columns: repeat(25, 1fr); gap: 7px; margin-top: 8px; }
.w-msgs i { aspect-ratio: 1; border-radius: 6px; background: #6d5bd0; display: block; }
.w-leg { display: flex; align-items: center; gap: 12px; font: 500 26px var(--mono); color: var(--p-mut); margin-top: 14px; flex-wrap: wrap; }
.w-leg b { color: var(--p-ink); font-weight: 600; }
.w-leg .sw { width: 18px; height: 18px; border-radius: 5px; display: inline-block; }
.w-main { flex: 1; min-height: 0; display: flex; align-items: center; gap: 44px; margin-top: 18px; }
.w-glass { flex: none; height: var(--gh); width: calc(var(--gh) * 200 / 260); }
.sq .w-v { font-size: 78px; } .sq .w-r { font-size: 26px; } .sq .w-nums { gap: 22px; }
.sq .d-ans i:nth-child(4) { display: none; }
.cap.nr .p { padding-right: 110px; }
.w-nums { flex: 1; display: grid; gap: 34px; }
.w-l { font: 600 25px var(--mono); letter-spacing: .1em; color: var(--p-mut); text-transform: uppercase; }
.w-v { white-space: nowrap; font-weight: 700; font-size: 98px; line-height: 1.02; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.w-r { font-size: 30px; color: #47505f; margin-top: 6px; line-height: 1.3; }

/* Ölçüm */
.m-dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 9px; margin-top: 6px; }
.m-dots i { aspect-ratio: 1; border-radius: 7px; display: block; }
.m-leg { display: flex; gap: 8px 24px; flex-wrap: wrap; font-size: 27px; color: #47505f; margin-top: 16px; }
.m-leg span { display: inline-flex; align-items: center; gap: 8px; }
.m-leg i { width: 18px; height: 18px; border-radius: 5px; display: inline-block; }
.m-rows { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; margin-top: 12px; }
.m-row { display: flex; gap: 28px; align-items: center; }
.m-row b { flex: none; width: 290px; font-weight: 700; font-size: 88px; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.m-row span { font-size: 32px; line-height: 1.28; color: #2c3340; }

/* Tam ekran sahneler */
.full { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 8%; }
.big { font-weight: 700; font-size: var(--fbig); line-height: 1.04; letter-spacing: -0.03em; text-wrap: balance; }
.big em { font-style: normal; color: var(--acc2); }
.h-bar { width: min(78%, 980px); margin-top: 60px; }
.h-bar .lb { display: flex; justify-content: space-between; font: 600 36px var(--mono); color: var(--mut); margin-bottom: 14px; }
.h-bar .lb b { color: var(--ink); }
.h-track { height: 52px; border-radius: 26px; background: rgba(255,255,255,.12); overflow: hidden; }
.h-fill { height: 100%; border-radius: 26px; }
.h-stamp { margin-top: 30px; font: 700 42px var(--mono); color: #ff8b78; }
.lg { display: flex; align-items: center; gap: 30px; margin-top: 54px; text-align: left; }
.lg .nm { font-weight: 700; font-size: 92px; letter-spacing: -0.03em; line-height: 1; }
.lg .sb { font-size: 38px; color: #d5d9e4; margin-top: 12px; }
.chips { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 44px; }
.chips span { font: 600 33px var(--mono); padding: 14px 26px; border-radius: 999px; border: 2px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); }
.pv { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 56px; font: 600 34px var(--mono); flex-wrap: wrap; }
.pv .nd { padding: 20px 28px; border-radius: 18px; border: 2px solid rgba(255,255,255,.3); background: rgba(255,255,255,.07); }
.pv .nd.off { border-style: dashed; color: var(--mut); position: relative; }
.pv .ar { font-size: 52px; color: var(--ok); } .pv .ar.x { color: #ff8b78; }

/* Son kare */
.end { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 90px; padding: 0 7%; }
.tall .end, .mid .end, .sq .end { flex-direction: column; gap: 40px; text-align: center; }
.e-l { display: flex; flex-direction: column; align-items: flex-start; }
.tall .e-l, .mid .e-l, .sq .e-l { align-items: center; }
.e-nm { font-weight: 700; font-size: var(--fend); letter-spacing: -0.035em; line-height: 1; margin-top: 30px; }
.e-sb { font-size: calc(var(--fp) * 1.2); color: #d5d9e4; margin-top: 16px; }
.e-st { margin-top: 36px; font-size: calc(var(--fp) * 1.12); line-height: 1.35; }
.e-st b { color: var(--acc2); white-space: nowrap; }
.e-url { margin-top: 14px; font: 500 26px var(--mono); color: var(--mut); overflow-wrap: anywhere; max-width: 1000px; line-height: 1.4; }
.tall .e-url, .mid .e-url, .sq .e-url { font-size: 23px; }
.e-ft { margin-top: 28px; font-size: 27px; color: var(--mut); line-height: 1.4; max-width: 900px; }
.e-qr { flex: none; background: #fff; border-radius: 34px; padding: 30px 30px 22px; color: #111; text-align: center; box-shadow: 0 40px 110px -30px rgba(0,0,0,.8); }
.e-qr svg { display: block; width: var(--qr); height: var(--qr); shape-rendering: crispEdges; }
.e-qr div { font: 600 30px var(--mono); margin-top: 16px; }
</style></head>
<body>
<div id="root"><div id="glowA"></div><div id="glowB"></div><div id="grid"></div></div>
<script src="data.js"></script>
<script src="qr.js"></script>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const LANG = Q.get("lang") === "en" ? "en" : "tr", V = Q.get("v") || "main";
const W = +Q.get("w") || 1920, H = +Q.get("h") || 1080;
const MODE = W / H > 1.3 ? "wide" : H / W > 1.5 ? "tall" : H / W > 1.15 ? "mid" : "sq";
const D = window.VDATA[LANG];
const STORE = "chromewebstore.google.com/detail/chbjpjhmkpgfocnfpdafkakjicdicige";

// ---- yerleşim: [x, y, genişlik, yükseklik] ----
const LAY = {
  wide: { cap: [110, 150, 630, 780], dev: [810, 170, 1010, 790], f: { k: 25, h: 78, p: 33, big: 118, end: 120, qr: 420, gh: 430 }, brand: [110, 62] },
  tall: { cap: [70, 250, 940, 400], dev: [50, 670, 980, 900], f: { k: 26, h: 84, p: 37, big: 104, end: 110, qr: 380, gh: 500 }, brand: [70, 130] },
  mid: { cap: [60, 136, 960, 330], dev: [50, 478, 980, 832], f: { k: 24, h: 66, p: 31, big: 94, end: 100, qr: 330, gh: 450 }, brand: [60, 44] },

// ---- metinler ----
const S = {
  tr: {
    on: "claude.ai'de", rep: "temsili arayüz", ph: "Mesajını yaz…", brand: "Token Tahmini", est: "tahmin",
    hkA: "Limit, işin tam ortasında bitti.", hkB: "Göndermeden önce <em>bilsen?</em>", hkBar: "5 saatlik limit", hkFull: "Limit doldu",
    hkTiko: "Mesaj kutunun yanında <em>biri yaşıyor.</em>", hkWater: "Bu hafta ne kadar <em>su kurtardın?</em>", hkModel: "Kısa bir çeviri için <em>en güçlü model</em> şart mı?",
    hkDemo: "Bir mesajın limitinden ne kadar yiyeceğini <em>göndermeden önce</em> gör.",

    c3: ["Tiko", "Tiko cevabın üstüne oturur.", "Yazarken imlecini izler, cevap gelirken ayak sallar. Hiçbir metni okumaz; istersen kapatırsın."],
    ct: ["En kötü hata: fazla hafif model", "Emin değilse Haiku demez.", "İçinde “çeviri” geçiyor ama bu bir yapım işi. Öneri: $1."],
    cw: ["Haftalık rapor", "Kurtardığın su ve enerji.", "Örnek: $1 kısa çeviriyi Opus 5.5 yerine önerilen Haiku 5.5 ile gönderirsen. Tahmindir; Anthropic bu rakamları yayımlamıyor."],
    cwS: ["Haftalık rapor", "Hafif model yetince bardak dolar.", "Örnek: $1 kısa çeviri, Opus 5.5 yerine Haiku 5.5 ile. Tahmindir."],
    cm: ["Ölçtük · sayılar olduğu gibi", "Ne kadar doğru?", "Öneriler kör bir hakemle sınandı; hakem bir model, tek tur. Uzun mesaj sorunu henüz çözülmedi."],
    s1a: ["Tiko", "Yazarken imlecini izler.", ""], s1b: ["Tiko", "Tahmini gösterir: limitinin yüzde kaçı.", ""],
    s1c: ["Tiko", "Gönderince mesajınla uçar.", ""], s1d: ["Tiko", "Cevabın üstünde ayak sallar.", "Hiçbir metni okumaz. İstersen kapatırsın."],
    advSave: "Bu mesaj: $1 → $2 ile $3 (%$4 tasarruf)", advUp: "Algılanan iş: $1",
    wMsgs: "$1 çeviri", wFrom: "Opus 5.5 · Yüksek", wTo: "Haiku 5.5 · Düşük",
    mT: "Önerilen model yetiyor mu? · 58 istem", mL: ["uygun 19", "fazla hafif 5", "gerekenden ağır 33", "ölçülemedi 1"],
    m1: "Haiku önerilen 13 istemin hepsinde Haiku'nun cevabı 5 üzerinden 4 ve üstü aldı.",
    m2: "Gerekenden hafif öneri: %9 (%95 güven aralığı %4–19).",
    m3v: "%36", m3: "Başkalarının yazdığı 300 uzun mesajda iş türü doğruluğu. Kendi yazdığımız kısa testlerde %82–88 idi.",
    pvH: "Mesajların cihazından <em>çıkmaz.</em>", pvP: "Sunucu yok, analitik yok. Eklenti yalnızca claude.ai ile, senin oturumunla konuşur.",
    pvA: "tarayıcın", pvB: "claude.ai", pvC: "başka sunucu", pvChips: ["Açık kaynak · AGPL-3.0", "Arayüz 10 dilde", "Ücretsiz"],
    eNm: "Token Tahmini", eSb: "claude.ai için ücretsiz Chrome eklentisi", eSt: "Chrome Web Store'da: <b>Token Forecast for Claude</b>",
    eQr: "Kamerayla tara", eFt: "Bağımsız bir öğrenci projesi; Anthropic ile bağlantısı yoktur. Açık kaynak (AGPL-3.0). Sayılar tahmindir.",
  },
  en: {
    on: "on claude.ai", rep: "illustrative UI", ph: "Write your message…", brand: "Token Forecast", est: "estimate",
    hkA: "Your limit ran out mid-task.", hkB: "What if you knew <em>before sending?</em>", hkBar: "5-hour limit", hkFull: "Limit reached",
    hkTiko: "Someone lives <em>next to your message box.</em>", hkWater: "How much water did you <em>save this week?</em>", hkModel: "Do you need the <em>strongest model</em> for a short translation?",
    hkDemo: "See how much of your limit a message will use, <em>before you send it.</em>",
    lgSub: "A free Chrome extension for claude.ai",
    c1: ["As you type", "See it before you send.", "About what share of your 5-hour limit will this message use? A range, not a single number."],
    c2: ["Model advice", "The lightest model that does the job.", "For a short translation $1 is enough. Apply the advice and this message's forecast goes $2 → $3."],

    cwS: ["Weekly report", "When a lighter model is enough, the glass fills.", "Example: $1 short translations with Haiku 5.5 instead of Opus 5.5. An estimate."],
    cm: ["Measured · numbers as they are", "How accurate is it?", "Suggestions were tested with a blind judge; the judge is a model, one round. Long messages are not solved yet."],
    s1a: ["Tiko", "It follows your cursor as you type.", ""], s1b: ["Tiko", "It shows the forecast: what share of your limit.", ""],
    s1c: ["Tiko", "It flies off with your message.", ""], s1d: ["Tiko", "It swings its feet on the answer.", "It reads no text. You can turn it off."],
    advSave: "This message: $1 → $3 with $2 ($4% saving)", advUp: "Detected task: $1",
    wMsgs: "$1 translations", wFrom: "Opus 5.5 · High", wTo: "Haiku 5.5 · Low",
    mT: "Is the suggested model enough? · 58 prompts", mL: ["fits 19", "too light 5", "heavier than needed 33", "not measurable 1"],
    m1: "In all 13 prompts where Haiku was suggested, Haiku's answer scored 4 or more out of 5.",

    pvH: "Your messages <em>never leave</em> your device.", pvP: "No server, no analytics. The extension talks only to claude.ai, with your own session.",
    pvA: "your browser", pvB: "claude.ai", pvC: "any other server", pvChips: ["Open source · AGPL-3.0", "Interface in 10 languages", "Free"],
    eNm: "Token Forecast", eSb: "A free Chrome extension for claude.ai", eSt: "On the Chrome Web Store: <b>Token Forecast for Claude</b>",
    eQr: "Scan to install", eFt: "An independent student project; not affiliated with Anthropic. Open source (AGPL-3.0). Numbers are estimates.",
  },
}[LANG];
const fill = (s, a) => s.replace(/\$(\d)/g, (_, i) => a[i - 1] ?? "");
const capOf = (key) => {
  const c = S[key].slice();
  if (key === "c2") c[2] = fill(c[2], [D.light.suggested, D.light.pill.replace("≈ ", ""), D.light.after.pill.replace("≈ ", "")]);
  if (key === "ct") c[2] = fill(c[2], [D.trap.suggested]);
  if (key === "cw" || key === "cwS") c[2] = fill(c[2], [String(D.eco.n)]);
  return c;
};

// ---- yardımcılar ----
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (u, a, b) => clamp((u - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const box = (el, r) => { el.style.left = r[0] + "px"; el.style.top = r[1] + "px"; el.style.width = r[2] + "px"; if (r[3]) el.style.height = r[3] + "px"; };

// ---- Tiko: site/build/index.src.html içindeki TIKO_SVG ile aynı ızgara ve renkler (yeni çizim değil) ----
const PAL = { K: "#3b2415", O: "#f28c28", H: "#ffc98b", D: "#c9661a", W: "#ffffff", P: "#ff8f70", Y: "#ffd84a", G: "#6fcf8a", R: "#e0533a" };
const rects = (rows, x0 = 0, y0 = 0) => {
  let o = "";
  rows.forEach((row, y) => { let x = 0; while (x < row.length) { const c = row[x]; if (c === "." || c === " ") { x++; continue; } let e = x; while (e < row.length && row[e] === c) e++; o += `<rect x="${x0 + x}" y="${y0 + y}" width="${e - x}" height="1" fill="${PAL[c]}"/>`; x = e; } });
  return o;
};
const TIKO_SVG = (function () {
  const HEAD = ["..KKKKKKKKKK..", ".KOOOOOOOOOOK.", ".KOHHOOOOOOOK.", ".KOOOOOOOOOOK.", ".KOOOOOOOOOOK.", ".KPOKOOOOKOPK.", ".KOOOKKKKOOOK.", ".KOOOOOOOOOOK.", "..KKKKKKKKKK.."];
  const BODY = ["...KOOOOOOK...", "...KOGGYROK...", "...KOOOOOOK...", "...KKKKKKKK..."];
  const ARM_L = ["KO", "KO", "KO", "KK"], ARM_R = ["OK", "OK", "OK", "KK"];
  const LEG_A = ["....KO..OK....", "...KKK..KKK..."];
  const LEG_B = ["...KKK..OK....", ".......KKK...."];
  return `<svg viewBox="0 0 14 17">
    <g class="lgA">${rects(LEG_A, 0, 15)}</g><g class="lgB">${rects(LEG_B, 0, 15)}</g>
    <g class="body">
      <g class="armL">${rects(ARM_L, 1, 11)}</g><g class="armR">${rects(ARM_R, 11, 11)}</g>
      ${rects(BODY, 0, 11)}${rects(HEAD, 0, 2)}
      <g class="lt">${rects(["YY"], 6, 0)}</g>${rects(["KK"], 6, 1)}
      <g class="pupil"><rect x="3" y="5" width="2" height="2" fill="${PAL.K}"/><rect x="9" y="5" width="2" height="2" fill="${PAL.K}"/><rect x="3" y="5" width="1" height="1" fill="${PAL.W}"/><rect x="9" y="5" width="1" height="1" fill="${PAL.W}"/></g>
      <g class="lid"><rect x="2" y="5" width="4" height="2" fill="${PAL.O}"/><rect x="8" y="5" width="4" height="2" fill="${PAL.O}"/><rect x="3" y="6" width="2" height="1" fill="${PAL.K}"/><rect x="9" y="6" width="2" height="1" fill="${PAL.K}"/></g>
    </g></svg>`;
})();
const MAIL_SVG = `<svg viewBox="0 0 7 5">${rects(["KKKKKKK", "KKWWWKK", "KWKWKWK", "KWWKWWK", "KKKKKKK"])}</svg>`;
function makeTiko(px) {
  const el = $(`<div class="tk" style="--tp:${px}"><div class="sh"></div><div class="sp">${TIKO_SVG}</div><div class="mail">${MAIL_SVG}</div></div>`);
  const q = (s) => el.querySelector(s);
  el._ = { sp: q(".sp"), sh: q(".sh"), mail: q(".mail"), lgA: q(".lgA"), lgB: q(".lgB"), body: q(".body"), armL: q(".armL"), armR: q(".armR"), pupil: q(".pupil"), lid: q(".lid"), lt: q(".lt"), px };
  return el;
}
// Duruş: stand | hover | walk | sit | fly | clap | nod | wave. t = saniye (animasyon saati).
function poseTiko(el, o) {
  const P = el._, t = o.t || 0, pose = o.pose || "stand", px = P.px;
  const step = (per) => Math.floor(t / per) % 2 === 0;
  el.style.transform = `translate(${o.x.toFixed(2)}px,${o.y.toFixed(2)}px)`;
  el.style.opacity = o.op == null ? 1 : o.op;
  let spY = 0, sx = 1, sy = 1, bodyY = 0, aL = [0, 0], aR = [0, 0], legB = false, legBoth = false, mail = false, shOp = 1, shS = 1, lx = o.lx || 0, ly = o.ly || 0;
  if (pose === "stand") bodyY = step(0.55) ? 0 : 0.6;
  else if (pose === "hover") { const s = Math.sin(t * Math.PI * 2 / 1.5); spY = (-2.5 + 1.5 * s) * px; shOp = 0.75 + 0.25 * s; shS = 0.85 + 0.15 * s; }
  else if (pose === "walk") { legB = !step(0.13); legBoth = true; aL = [0, step(0.13) ? 0 : -1]; aR = [0, step(0.13) ? -1 : 0]; }
  else if (pose === "sit") { legB = !step(0.5); legBoth = true; shOp = 0; if (o.read) { const k = Math.floor(t / 0.8) % 3; lx = k - 1; ly = 1; } }
  else if (pose === "fly") { aL = [-1, -4]; aR = [1, -4]; sx = 0.92; sy = 1.14; mail = o.mail !== false; shOp = 0; }
  else if (pose === "clap") { const c = step(0.12); aL = [c ? -1 : 1, -4]; aR = [c ? 1 : -1, -4]; spY = -Math.abs(Math.sin(t * Math.PI / 0.45)) * 4 * px * 0.35; shOp = o.sat ? 0 : 1; legBoth = !!o.sat; legB = o.sat ? !step(0.5) : false; }
  else if (pose === "nod") { bodyY = step(0.16) ? 0 : 1; aR = [1, -4]; }
  else if (pose === "wave") { aR = [0, step(0.25) ? 0 : -3]; bodyY = step(0.55) ? 0 : 0.6; }
  if (o.squash) { sx *= 1 + 0.18 * o.squash; sy *= 1 - 0.2 * o.squash; }
  P.sp.style.transform = `translateY(${spY.toFixed(2)}px) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;
  P.sh.style.opacity = shOp; P.sh.style.transform = `scaleX(${shS})`;
  P.body.setAttribute("transform", `translate(0,${bodyY})`);
  P.armL.setAttribute("transform", `translate(${aL[0]},${aL[1]})`); P.armR.setAttribute("transform", `translate(${aR[0]},${aR[1]})`);
  P.lgA.style.display = legBoth && legB ? "none" : ""; P.lgB.style.display = legBoth && legB ? "" : "none";
  P.pupil.setAttribute("transform", `translate(${lx},${ly})`);
  const bl = t % 4.2; P.lid.style.opacity = bl > 3.9 && bl < 4.04 ? 1 : 0;
  P.lt.style.opacity = t % 1.6 < 0.8 ? 1 : 0.25;
  P.mail.style.display = mail ? "" : "none";
}

// ---- altyazı ----
function makeCap(list) { // list: [[başlangıç saniyesi, [üst yazı, başlık, metin]], …]
  const el = $(`<div class="cap"></div>`); box(el, LAY.cap);
  const items = list.map(([at, c]) => {
    const ci = $(`<div class="ci"><div class="k">${esc(c[0])}</div><div class="h">${esc(c[1])}</div>${c[2] ? `<div class="p">${esc(c[2])}</div>` : ""}</div>`);
    el.append(ci); return { at, ci };
  });
  el._upd = (u, d) => items.forEach((it, i) => {
    const end = i + 1 < items.length ? items[i + 1].at : d + 9;
    const op = (i === 0 && it.at <= 0 ? 1 : seg(u, it.at, it.at + 0.4)) * (1 - seg(u, end - 0.3, end));
    const dy = i === 0 && it.at <= 0 ? 0 : (1 - eo(seg(u, it.at, it.at + 0.55))) * 26;
    it.ci.style.opacity = op; it.ci.style.transform = MODE === "wide" ? `translateY(calc(-50% + ${dy}px))` : `translateY(${dy}px)`;
  });
  return el;
}

// ================= SAHNELER =================
// Her sahne { d, el, upd(u) } döndürür; u sahnenin kendi saniyesidir.

// ---- Giriş ----
function hook(d, o) {
  const el = $(`<section class="sc"><div class="full ha"></div><div class="full hb"></div></section>`);
  const ha = el.querySelector(".ha"), hb = el.querySelector(".hb");
  if (o.a) ha.innerHTML = `<div class="big">${S[o.a]}</div><div class="h-bar"><div class="lb"><span>${esc(S.hkBar)}</span><b class="pc"></b></div><div class="h-track"><div class="h-fill"></div></div></div><div class="h-stamp">${esc(S.hkFull)}</div>`;
  hb.innerHTML = `<div class="big">${S[o.b]}</div><div class="lg"><div class="slot" style="width:${14 * 11}px;height:${17 * 11}px;position:relative"></div><div><div class="nm">${esc(S.brand)}</div><div class="sb">${esc(S.lgSub)}</div></div></div>`;
  const tk = makeTiko(11); hb.querySelector(".slot").append(tk);
  const pc = ha.querySelector(".pc"), fillEl = ha.querySelector(".h-fill"), stamp = ha.querySelector(".h-stamp"), lg = hb.querySelector(".lg"), bigB = hb.querySelector(".big");
  const cut = o.a ? d * 0.46 : 0; // a → b geçişi
  return { d, el, upd(u) {
    if (o.a) {
      const f = eio(seg(u, 0.35, cut - 1.0)), v = lerp(84, 100, f), full = v >= 99.95;
      ha.style.opacity = 1 - seg(u, cut - 0.3, cut); ha.style.display = u < cut ? "" : "none";
      pc.textContent = LANG === "tr" ? "%" + Math.round(v) : Math.round(v) + "%";
      fillEl.style.width = v + "%"; fillEl.style.background = full ? "#e0533a" : v > 93 ? "#d9982b" : "#f28c28";
      const sh = full ? Math.sin((u - (cut - 1.0)) * 40) * 7 * (1 - seg(u, cut - 1.0, cut - 0.55)) : 0;
      ha.querySelector(".h-bar").style.transform = `translateX(${sh.toFixed(1)}px)`;
      stamp.style.opacity = full ? 1 : 0;
    } else ha.style.display = "none";
    const b0 = cut + (o.a ? 0.1 : 0);
    hb.style.display = u >= cut ? "" : "none";
    bigB.style.opacity = o.a ? seg(u, b0, b0 + 0.4) : 1;
    bigB.style.transform = `translateY(${o.a ? (1 - eo(seg(u, b0, b0 + 0.5))) * 30 : 0}px)`;
    const l0 = b0 + (o.a ? 0.9 : 0.5);
    lg.style.opacity = seg(u, l0, l0 + 0.35); lg.style.transform = `translateY(${(1 - eo(seg(u, l0, l0 + 0.5))) * 24}px)`;
    // Tiko yukarıdan düşer, yere değince ezilir, el sallar
    const fall = seg(u, l0 + 0.05, l0 + 0.55), land = seg(u, l0 + 0.55, l0 + 0.85);
    poseTiko(tk, { x: 0, y: -(1 - fall * fall) * 150, t: u, pose: fall < 1 ? "fly" : land < 1 ? "stand" : "wave", mail: false, squash: fall >= 1 ? Math.sin(land * Math.PI) : 0, op: seg(u, l0, l0 + 0.15), lx: 0 });
  } };
}

// ---- Sohbet penceresi ----
function chat(d, exKey, B, caps, o = {}) {
  const ex = D[exKey], tp = o.px || 8, tw = 14 * tp, th = 17 * tp;
  const el = $(`<section class="sc"></section>`);
  const cap = makeCap(caps.map(([at, k]) => [at, capOf(k)])); el.append(cap);
  const up = ex.kind === "upgrade";
  const advD = ex.kind === "save" ? fill(S.advSave, [ex.from, ex.suggested, ex.to, String(ex.saving)]) : fill(S.advUp, [ex.type]);
  const dev = $(`<div class="dev">
    <div class="d-bar"><i></i><i></i><i></i><span class="d-on">${esc(S.on)}</span><span class="d-rep">${esc(S.rep)}</span></div>
    <div class="d-msgs"><div class="d-user">${esc(ex.text)}</div><div class="d-ans"><i style="width:96%"></i><i style="width:88%"></i><i style="width:93%"></i><i style="width:58%"></i></div>
      <div class="d-ext"><div class="x-adv${up ? " up" : ""}"><span class="x-ic">${up ? "↑" : "↓"}</span><div><b class="x-t">${esc(ex.title)}</b><span class="x-d">${esc(advD)}</span></div></div>
        <div class="x-pill"><i class="dot"></i><b></b><span class="rg"></span><span>${esc(ex.sub)}</span></div></div></div>
    <div class="d-comp"><div class="d-text"><span class="tx"></span><span class="caret"></span><span class="ph">${esc(S.ph)}</span></div>
      <div class="d-row"><span class="chip cm"></span><span class="chip ce"></span><span class="send">↑</span></div></div>
  </div>`);
  box(dev, LAY.dev); el.append(dev);
  const q = (s) => dev.querySelector(s);
  const user = q(".d-user"), ans = q(".d-ans"), lines = [...ans.children], adv = q(".x-adv"), pill = q(".x-pill"), pb = pill.querySelector("b"), prg = pill.querySelector(".rg"),
    comp = q(".d-comp"), tx = q(".tx"), caret = q(".caret"), ph = q(".ph"), cm = q(".cm"), ce = q(".ce"), send = q(".send");
  const tk = makeTiko(tp); dev.append(tk);
  const R = (e) => { const a = e.getBoundingClientRect(), b = dev.getBoundingClientRect(); return { x: a.left - b.left, y: a.top - b.top, w: a.width, h: a.height }; };
  const N = ex.text.length, nAt = (u) => Math.round(N * seg(u, B.t0, B.t1));
  // Tiko yazının üstüne inmez: mesaj kutusunun üst kenarında süzülür, imleci yalnızca yatayda izler (eklentideki kural)
  const hoverAt = (n) => { tx.textContent = ex.text.slice(0, n); caret.style.display = ""; const c = R(caret), k = R(comp); return { x: clamp(c.x - tw * 0.3, 8, LAY.dev[2] - tw - 8), y: k.y - th - 6 }; };
  const T = { adv: B.adv ?? 1e9, sw: B.sw ?? 1e9, send: B.send ?? 1e9, ans: B.ans ?? 1e9, done: B.done ?? 1e9 };
  const advOff = Math.min(T.sw, T.send);
  return { d, el, upd(u) {
    cap._upd(u, d);
    const sent = u >= T.send, switched = u >= T.sw;
    // Tiko'nun yazarken izlediği nokta: imlecin son 0,35 saniyedeki konumlarının ortalaması (yay gibi geç kalır)
    let hov = { x: 0, y: 0 };
    for (const lag of [0.05, 0.15, 0.25, 0.35]) { const p = hoverAt(nAt(u - lag)); hov.x += p.x / 4; hov.y += p.y / 4; }
    const hovEnd = hoverAt(N);
    // yazı
    const n = sent ? 0 : nAt(u);
    tx.textContent = ex.text.slice(0, n); ph.style.display = n ? "none" : "";
    caret.style.display = sent || (n && u > B.t1 && Math.floor(u * 2) % 2) ? "none" : n ? "" : "none";
    cm.textContent = switched ? ex.after.model : ex.model; ce.textContent = switched ? ex.after.effort : ex.effort;
    const ring = switched ? 1 - seg(u, T.sw, T.sw + 1.3) : 0;
    for (const c of [cm, ce]) { c.style.boxShadow = ring ? `0 0 0 ${(3 + 5 * ring).toFixed(1)}px rgba(242,140,40,${(0.75 * ring).toFixed(2)})` : "none"; c.style.background = switched ? "#dff1e8" : ""; }
    send.style.transform = `scale(${1 - 0.18 * Math.sin(seg(u, T.send - 0.12, T.send + 0.2) * Math.PI)})`;
    // hap
    const pIn = seg(u, B.pill, B.pill + 0.35), pOut = seg(u, T.send, T.send + 0.3);
    pill.style.opacity = pIn * (1 - pOut); pill.style.transform = `scale(${0.7 + 0.3 * back(pIn)})`;
    pb.textContent = switched ? ex.after.pill : ex.pill; prg.textContent = "(" + (switched ? ex.after.range : ex.range) + ")";
    pb.style.transform = `scale(${1 + 0.22 * Math.sin(seg(u, T.sw, T.sw + 0.5) * Math.PI)})`;
    // öneri bildirimi
    const aIn = seg(u, T.adv, T.adv + 0.4), aOut = seg(u, advOff, advOff + 0.3);
    adv.style.opacity = aIn * (1 - aOut); adv.style.transform = `translateY(${(1 - eo(aIn)) * 34}px)`;
    // gönderilen mesaj ve cevap
    const uIn = seg(u, T.send, T.send + 0.35);
    user.style.opacity = uIn; user.style.transform = `translateY(${(1 - eo(uIn)) * 70}px)`;
    ans.style.opacity = seg(u, T.send + 0.5, T.send + 0.9);
    const ld = (T.done - T.ans) / lines.length;
    lines.forEach((ln, i) => { ln.style.transform = `scaleX(${eo(seg(u, T.ans + i * ld, T.ans + (i + 1) * ld)).toFixed(4)})`; });

    // Tiko: konumlar o anki yerleşimden okunur
    const c = R(comp), a = R(adv), s = R(ans);
    const home = { x: c.x + 10, y: c.y - th }, onAdv = { x: a.x + 24, y: a.y - th }, sit = { x: s.x + 24, y: s.y - 15 * tp };
    let p = home, pose = "stand", lx = 0, ly = 0, squash = 0, read = false, sat = false, mail = false;
    const hop = (from, to, t0, dur, arc) => { const k = seg(u, t0, t0 + dur), e = eio(k); return { x: lerp(from.x, to.x, e), y: lerp(from.y, to.y, e) - Math.sin(k * Math.PI) * arc, k }; };
    if (u >= B.t0 && u < B.t1) { const k = eo(seg(u, B.t0, B.t0 + 0.5)); p = { x: lerp(home.x, hov.x, k), y: lerp(home.y, hov.y, k) }; pose = "hover"; lx = 1; ly = 1; }
    else if (u >= B.t1) {
      const m = hop(hovEnd, home, B.t1 + 0.15, 0.55, 30); p = m; pose = m.k <= 0 ? "hover" : m.k < 1 ? "walk" : "stand";
      if (m.k >= 1) { squash = Math.sin(seg(u, B.t1 + 0.7, B.t1 + 0.95) * Math.PI); lx = u >= B.pill ? 1 : 0; }
      if (u >= T.adv - 0.05) {
        const m2 = hop(home, onAdv, T.adv - 0.05, 0.5, 60); p = m2; pose = m2.k < 1 ? "walk" : "stand"; lx = 1; ly = 1;
        if (m2.k >= 1) { squash = Math.sin(seg(u, T.adv + 0.45, T.adv + 0.7) * Math.PI); if (!up && u > T.adv + 1.0 && u < T.adv + 2.2) pose = "nod"; }
        if (u >= advOff + 0.05) { const m3 = hop(onAdv, home, advOff + 0.05, 0.5, 40); p = m3; pose = m3.k < 1 ? "walk" : "stand"; lx = 1; ly = 0; squash = 0; }
      }
      if (sent) {
        const m4 = hop(home, sit, T.send + 0.05, 1.0, 150);
        p = m4; pose = m4.k < 1 ? "fly" : "sit"; mail = true; lx = 0; ly = m4.k < 1 ? -1 : 0; squash = 0;
        if (m4.k >= 1) { read = u >= T.ans; sat = true; squash = Math.sin(seg(u, T.send + 1.05, T.send + 1.3) * Math.PI) * 0.7; }
        if (u >= T.done && u < T.done + 1.6) pose = "clap";
      }
    }
    poseTiko(tk, { x: p.x, y: p.y, t: u, pose, lx, ly, squash, read, sat, mail });
    // ölçüm için değiştirilen yazıyı geri koy
    tx.textContent = ex.text.slice(0, n);
  } };
}

// ---- Haftalık rapor: su ve enerji ----
function water(d, capKey = "cw") {
  const E = D.eco, el = $(`<section class="sc"></section>`);
  const cap = makeCap([[0, capOf(capKey)]]); el.append(cap);
  const dev = $(`<div class="dev"><div class="c-head"><span>${esc(E.title)}</span><span class="tag">${esc(S.est)}</span></div>
    <div class="c-body">
      <div class="w-msgs">${"<i></i>".repeat(E.n)}</div>
      <div class="w-leg"><b class="cnt"></b><span class="sw" style="background:#6d5bd0"></span>${esc(S.wFrom)} → <span class="sw" style="background:${"#2f9d6a"}"></span>${esc(S.wTo)}</div>
      <div class="w-main">
        <svg class="w-glass" viewBox="0 0 200 260"><defs><clipPath id="gc${capKey}"><path d="M24 14 L176 14 L158 246 L42 246 Z"/></clipPath></defs>
          <g clip-path="url(#gc${capKey})"><path class="wt" fill="#4a98dc"/><path class="wt2" fill="#7db8ea" opacity=".55"/></g>
          <path d="M20 10 L180 10 L161 250 L39 250 Z" fill="none" stroke="#1b1f2a" stroke-width="7" stroke-linejoin="round"/>
          <g class="drops" fill="#4a98dc"></g></svg>
        <div class="w-nums">
          <div><div class="w-l">${esc(E.waterL)}</div><div class="w-v wv" style="color:#2f7fc8"></div><div class="w-r">${esc(E.waterRange)}<br>${esc(E.glass)}</div></div>
          <div><div class="w-l">${esc(E.energyL)}</div><div class="w-v ev" style="color:#b8741a"></div><div class="w-r">${esc(E.energyRange)}<br>${esc(E.phone)}</div></div>
        </div>
      </div>
    </div></div>`);
  box(dev, LAY.dev); el.append(dev);
  const dots = [...dev.querySelectorAll(".w-msgs i")], cnt = dev.querySelector(".cnt"), wt = dev.querySelector(".wt"), wt2 = dev.querySelector(".wt2"), drops = dev.querySelector(".drops"),
    wv = dev.querySelector(".wv"), ev = dev.querySelector(".ev"), rs = [...dev.querySelectorAll(".w-r")];
  const wp = MODE === "wide" ? 8 : 5, tk = makeTiko(wp); dev.append(tk); if (MODE !== "wide") cap.classList.add("nr");
  const sig = (v) => new Intl.NumberFormat(LANG === "tr" ? "tr-TR" : "en-US", { maximumSignificantDigits: 2 }).format(v);
  const a0 = d * 0.07, a1 = d * 0.6; // dolma aralığı
  return { d, el, upd(u) {
    cap._upd(u, d);
    const f = eio(seg(u, a0, a1)), k = Math.round(f * E.n);
    dots.forEach((x, i) => { const on = i < k; x.style.background = on ? "#2f9d6a" : "#6d5bd0"; x.style.transform = `scale(${on && i === k - 1 && f < 1 ? 1.25 : 1})`; });
    cnt.textContent = fill(S.wMsgs, [k + " / " + E.n]);
    // su yüzeyi: bardağın içi y = 246 (dip) … 14 (ağız); dalga küçülerek durur
    const lvl = 246 - 232 * E.fill * f, amp = 5 * (1 - seg(u, a1, a1 + 1.2)) + 1.2, wave = (ph) => { let p = `M0 ${lvl}`; for (let x = 0; x <= 200; x += 10) p += ` L${x} ${(lvl + Math.sin(x / 26 + u * 4 + ph) * amp).toFixed(1)}`; return p + " L200 260 L0 260 Z"; };
    wt.setAttribute("d", wave(0)); wt2.setAttribute("d", wave(2.1));
    let ds = "";
    if (f > 0 && f < 1) for (let i = 0; i < 3; i++) { const ph = (u * 1.7 + i / 3) % 1, y = lerp(-30, lvl - 6, ph * ph); ds += `<path d="M${88 + i * 12} ${y.toFixed(1)} q7 12 0 17 q-7 -5 0 -17Z"/>`; }
    drops.innerHTML = ds;
    const cnt2 = (v) => (v < 1 ? "0" : sig(v)); // sayaç: dolarken yuvarlak ara değerler, dolunca eklentinin verdiği metin
    wv.textContent = f >= 1 ? E.water : "≈ " + cnt2(E.waterMid * f) + " mL"; ev.textContent = f >= 1 ? E.energy : "≈ " + cnt2(E.energyMid * f) + " Wh";
    rs.forEach((r, i) => { r.style.opacity = seg(u, a1 + 0.1 + i * 0.25, a1 + 0.5 + i * 0.25); });
    // Tiko kartın sağ üst kenarında oturur; bardak dolunca alkışlar
    const done = u >= a1 + 0.3 && u < a1 + 2.2;
    poseTiko(tk, { x: LAY.dev[2] - 14 * wp - 40, y: -15 * wp, t: u, pose: done ? "clap" : "sit", sat: true, lx: -1, ly: 1 });
  } };
}

// ---- Ölçüm ----
function measure(d) {
  const el = $(`<section class="sc"></section>`);
  const cap = makeCap([[0, capOf("cm")]]); el.append(cap);
  const COL = ["#2f9d6a", "#d8503f", "#d9982b", "#a3aab8"], CNT = [19, 5, 33, 1];
  let dots = ""; CNT.forEach((n, i) => { dots += `<i style="background:${COL[i]}"></i>`.repeat(n); });
  const dev = $(`<div class="dev"><div class="c-head"><span>${esc(S.mT)}</span></div>
    <div class="c-body"><div class="m-dots">${dots}</div>
      <div class="m-leg">${S.mL.map((x, i) => `<span><i style="background:${COL[i]}"></i>${esc(x)}</span>`).join("")}</div>
      <div class="m-rows">
        <div class="m-row"><b style="color:#23805a">13 / 13</b><span>${esc(S.m1)}</span></div>
        <div class="m-row"><b style="color:#c23f2f">5 / 58</b><span>${esc(S.m2)}</span></div>
        <div class="m-row"><b style="color:#a86a12">${esc(S.m3v)}</b><span>${esc(S.m3)}</span></div>
      </div></div></div>`);
  box(dev, LAY.dev); el.append(dev);
  const ds = [...dev.querySelectorAll(".m-dots i")], rows = [...dev.querySelectorAll(".m-row")], leg = dev.querySelector(".m-leg");
  const wp = MODE === "wide" ? 8 : 5, tk = makeTiko(wp); dev.append(tk); if (MODE !== "wide") cap.classList.add("nr");
  return { d, el, upd(u) {
    cap._upd(u, d);
    ds.forEach((x, i) => { const k = seg(u, 0.3 + i * 0.022, 0.55 + i * 0.022); x.style.opacity = k; x.style.transform = `scale(${0.4 + 0.6 * back(k)})`; });
    leg.style.opacity = seg(u, 1.5, 1.9);
    rows.forEach((r, i) => { const t0 = d * (0.2 + i * 0.17), k = seg(u, t0, t0 + 0.45); r.style.opacity = k; r.style.transform = `translateX(${(1 - eo(k)) * 40}px)`; });
    poseTiko(tk, { x: LAY.dev[2] - 14 * wp - 40, y: -15 * wp, t: u, pose: "sit", sat: true, read: true });
  } };
}

function privacy(d) {

    <div class="chips">${S.pvChips.map((c) => `<span>${esc(c)}</span>`).join("")}</div></div></section>`);
  const big = el.querySelector(".big"), p = el.querySelector(".p"), pv = [...el.querySelectorAll(".pv > *")], chips = [...el.querySelectorAll(".chips span")];
  return { d, el, upd(u) {
    big.style.transform = `translateY(${(1 - eo(seg(u, 0, 0.5))) * 30}px)`;

    chips.forEach((x, i) => { const k = seg(u, 1.9 + i * 0.18, 2.25 + i * 0.18); x.style.opacity = k; x.style.transform = `translateY(${(1 - eo(k)) * 20}px)`; });
  } };
}

// ---- Son kare: mağaza bağlantısı + QR ----
function end(d) {
  const M = window.VQR, n = M.length, qz = 4, tot = n + qz * 2;
  let r = ""; M.forEach((row, y) => { let x = 0; while (x < n) { if (row[x] !== "1") { x++; continue; } let e = x; while (e < n && row[e] === "1") e++; r += `<rect x="${x + qz}" y="${y + qz}" width="${e - x}" height="1"/>`; x = e; } });
  const px = MODE === "sq" ? 9 : 12;
  const el = $(`<section class="sc"><div class="end">
    <div class="e-l"><div class="slot" style="width:${14 * px}px;height:${17 * px}px;position:relative"></div>
      <div class="e-nm">${esc(S.eNm)}</div><div class="e-sb">${esc(S.eSb)}</div>
      <div class="e-st">${S.eSt}</div><div class="e-url">${STORE}</div><div class="e-ft">${esc(S.eFt)}</div></div>
    <div class="e-qr"><svg viewBox="0 0 ${tot} ${tot}"><rect width="${tot}" height="${tot}" fill="#fff"/><g fill="#000">${r}</g></svg><div>${esc(S.eQr)}</div></div>
  </div></section>`);
  const tk = makeTiko(px); el.querySelector(".slot").append(tk);
  const parts = [".e-nm", ".e-sb", ".e-st", ".e-url", ".e-ft"].map((s) => el.querySelector(s)), qr = el.querySelector(".e-qr");
  return { d, el, upd(u) {
    parts.forEach((x, i) => { const k = seg(u, 0.15 + i * 0.12, 0.5 + i * 0.12); x.style.opacity = k; x.style.transform = `translateY(${(1 - eo(k)) * 22}px)`; });
    const k = seg(u, 0.35, 0.8); qr.style.opacity = k; qr.style.transform = `scale(${0.85 + 0.15 * eo(k)})`; // 0,8 sn'den sonra QR kıpırdamaz: taranabilsin
    const fall = seg(u, 0.05, 0.5), land = seg(u, 0.5, 0.8);
    poseTiko(tk, { x: 0, y: -(1 - fall * fall) * 150, t: u, pose: fall < 1 ? "fly" : u < 3.2 ? "wave" : "stand", mail: false, squash: fall >= 1 ? Math.sin(land * Math.PI) : 0, op: seg(u, 0, 0.12) });
  } };
}

// ================= KURULUM VE ÇİZİM =================
const root = document.getElementById("root");
root.style.width = W + "px"; root.style.height = H + "px"; root.className = MODE;
document.documentElement.lang = LANG;
for (const [k, v] of Object.entries(LAY.f)) root.style.setProperty(k === "qr" || k === "gh" ? "--" + k : "--f" + k, v + "px");
const gA = document.getElementById("glowA"), gB = document.getElementById("glowB");
for (const g of [gA, gB]) { g.style.width = g.style.height = Math.max(W, H) * 0.55 + "px"; }
const brand = $(`<div id="brand"></div>`); { const b = makeTiko(MODE === "sq" ? 3 : 4); brand.append(b, document.createTextNode(S.brand)); poseTiko(b, { x: 0, y: 0, t: 0 }); b.style.transform = "none"; }
brand.style.left = LAY.brand[0] + "px"; brand.style.top = LAY.brand[1] + "px"; root.append(brand);
const SC = (VIDEOS[V] || VIDEOS.main)();
let acc = 0; for (const s of SC) { s.t0 = acc; acc += s.d; root.append(s.el); }
const prog = $(`<div id="prog"></div>`); root.append(prog);
window.DUR = Math.round(acc * 1000) / 1000;
window.SCENES = SC.map((s) => [s.t0, s.d]);
const FADE = 0.3;
window.render = function (t) {
  t = clamp(t, 0, window.DUR - 1e-4);
  gA.style.transform = `translate(${(-0.18 + 0.1 * Math.sin(t * 0.21)) * W}px,${(-0.3 + 0.08 * Math.cos(t * 0.17)) * H}px)`;
  gB.style.transform = `translate(${(0.62 + 0.08 * Math.cos(t * 0.19)) * W}px,${(0.5 + 0.1 * Math.sin(t * 0.23)) * H}px)`;
  prog.style.width = (t / window.DUR) * W + "px";
  SC.forEach((s, i) => {
    const u = t - s.t0, on = u >= 0 && u < s.d;
    s.el.style.display = on ? "" : "none";
    if (!on) return;
    s.el.style.opacity = (i === 0 ? 1 : seg(u, 0, FADE)) * (i === SC.length - 1 ? 1 : 1 - seg(u, s.d - FADE, s.d));
    s.upd(u);
  });
  const full = SC.findIndex((s) => t >= s.t0 && t < s.t0 + s.d);
  const cls = SC[full] && SC[full].el.querySelector(".full, .end");
  brand.style.opacity = cls ? 0 : 1; // tam ekran sahnelerde köşe markası gizlenir
};
window.render(0);
