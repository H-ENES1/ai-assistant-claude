# Sürüm otomasyonu: "v*" etiketi gönderilince eklenti klasörünü zip'leyip GitHub sürümü oluşturur.
# Release automation: on a "v*" tag push, zip the extension folder and publish a GitHub release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "manifest $V != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Build install zip
        run: |
          cd extension && zip -qr "../token-tahmin-${GITHUB_REF_NAME}.zip" . -x README.md '*.bak'
          cd .. && zip -q "token-tahmin-${GITHUB_REF_NAME}.zip" LICENSE NOTICE
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "token-tahmin-${GITHUB_REF_NAME}.zip" \
            --title "Token Forecast ${GITHUB_REF_NAME#v}" --latest \
            --notes "Install: unzip, open chrome://extensions, enable Developer mode, Load unpacked, pick the folder. Message analysis works for Turkish and English messages only; translations are machine-made. Changes: see CLAUDE.md."
